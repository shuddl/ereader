<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Book cover background -->
  <rect width="200" height="300" fill="#f0f0f0"/>
  
  <!-- Book title placeholder -->
  <rect x="30" y="80" width="140" height="20" fill="#d0d0d0"/>
  <rect x="30" y="110" width="100" height="15" fill="#d0d0d0"/>
  
  <!-- Book icon -->
  <path d="M50,160 L150,160 L150,220 L50,220 Z" fill="#e0e0e0" stroke="#c0c0c0" stroke-width="2"/>
  <path d="M50,160 L100,180 L150,160 L150,220 L100,240 L50,220 Z" fill="#e5e5e5" stroke="#c0c0c0" stroke-width="1"/>
  <path d="M100,180 L100,240" stroke="#c0c0c0" stroke-width="1"/>
  
  <!-- Good E-Reader text -->
  <text x="100" y="270" font-family="Arial, sans-serif" font-size="12" fill="#808080" text-anchor="middle">Good E-Reader</text>
</svg>